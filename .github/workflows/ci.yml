name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck apps
        run: pnpm typecheck

      - name: Typecheck backend validation scripts
        run: pnpm --filter backend typecheck:scripts

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
