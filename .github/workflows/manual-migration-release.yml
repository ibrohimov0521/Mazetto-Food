name: Manual migration release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full, CI-verified main commit SHA
        required: true
        type: string
      phase:
        description: Apply migrations first, then deploy backend and each changed service
        required: true
        type: choice
        options:
          - backend
          - customer-web
          - pos-web
          - platform-web
          - telegram-bot
          - telegram-staff-bot
          - media
      verified_backup_path:
        description: Required for migration releases; leave empty for a targeted redeploy
        required: false
        type: string
      migrations_applied:
        description: Confirm production prisma migrate deploy completed before any app deployment
        required: true
        type: boolean
        default: false
      targeted_redeploy:
        description: Explicitly redeploy one service when production already points to this exact SHA
        required: true
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      checks: read
    env:
      SHA: ${{ inputs.release_sha }}
      PHASE: ${{ inputs.phase }}
      BACKUP_PATH: ${{ inputs.verified_backup_path }}
      MIGRATIONS_APPLIED: ${{ inputs.migrations_applied }}
      TARGETED_REDEPLOY: ${{ inputs.targeted_redeploy }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Release gate
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Full SHA required'; exit 1; }
          git fetch --quiet --force origin refs/tags/production:refs/tags/production
          node scripts/release-gate.mjs "$SHA" --github-output

      - name: Confirm release phase
        id: confirm
        env:
          APPS: ${{ steps.gate.outputs.apps }}
          MIGRATIONS: ${{ steps.gate.outputs.migrations }}
          SINCE: ${{ steps.gate.outputs.since }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)" \
            node scripts/manual-release-guard.mjs

      - name: Deploy selected service
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_BACKEND: ${{ vars.DOKPLOY_APP_BACKEND }}
          DOKPLOY_APP_CUSTOMER_WEB: ${{ vars.DOKPLOY_APP_CUSTOMER_WEB }}
          DOKPLOY_APP_POS_WEB: ${{ vars.DOKPLOY_APP_POS_WEB }}
          DOKPLOY_APP_PLATFORM_WEB: ${{ vars.DOKPLOY_APP_PLATFORM_WEB }}
          DOKPLOY_APP_TELEGRAM_BOT: ${{ vars.DOKPLOY_APP_TELEGRAM_BOT }}
          DOKPLOY_APP_TELEGRAM_STAFF_BOT: ${{ vars.DOKPLOY_APP_TELEGRAM_STAFF_BOT }}
          DOKPLOY_APP_MEDIA: ${{ vars.DOKPLOY_APP_MEDIA }}
          RELEASE_MODE: ${{ steps.confirm.outputs.mode }}
          DOKPLOY_APP_TIMEOUT_MS: 2100000
        run: |
          if [[ "$RELEASE_MODE" == targeted-redeploy ]]; then
            node scripts/dokploy-deploy.mjs --sha "$SHA" "$PHASE" --redeploy
          else
            node scripts/dokploy-deploy.mjs --sha "$SHA" "$PHASE"
          fi

      - name: Production smoke after POS
        if: inputs.phase == 'pos-web' || inputs.phase == 'platform-web'
        run: |
          for attempt in 1 2 3 4; do
            node scripts/smoke-production.mjs && exit 0
            [ "$attempt" = 4 ] || sleep 30
          done
          exit 1

      - name: Next step
        env:
          RELEASE_MODE: ${{ steps.confirm.outputs.mode }}
        run: |
          if [[ "$RELEASE_MODE" == targeted-redeploy ]]; then
            echo 'Targeted redeploy completed. The production tag already points to this SHA and was not changed.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$PHASE" == backend ]]; then
            echo 'Backend deployed after the confirmed migration. Dispatch each remaining changed app (including platform-web) with migrations_applied=true. Run the read-only smoke after the last web app.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Selected service deployed. Verify the release manually, then move the production tag to the release SHA.' >> "$GITHUB_STEP_SUMMARY"
          fi
