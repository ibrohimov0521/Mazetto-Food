name: Desktop Release

on:
  push:
    branches: [main, fix/telegram-photo-url-fallback]
    paths:
      - "apps/desktop/**"
      - "apps/pos-web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  detect-runtime-changes:
    name: Detect packaged runtime changes
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.skip-published.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether a Windows release is needed
        id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.before }}"
          if [[ "$base" =~ ^0+$ ]]; then base="${{ github.sha }}^"; fi
          changed_files="$(git diff --name-only "$base" "${{ github.sha }}")"
          runtime_files="$(printf '%s\n' "$changed_files" | grep -Ev '(^|/)(test|tests)/|(^|/)[^/]+\.(test|spec)\.[^/]+$|\.md$' || true)"
          if printf '%s\n' "$runtime_files" | grep -Eq '^(apps/desktop/|apps/pos-web/|packages/|pnpm-lock\.yaml$|package\.json$)'; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip already published Desktop versions
        id: skip-published
        shell: bash
        run: |
          should_release="${{ steps.filter.outputs.should_release }}"
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$should_release" == "true" ]] && git show-ref --verify --quiet "refs/tags/desktop-v$version"; then
            echo "::notice::Desktop $version is already published; skipping duplicate release."
            should_release=false
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
  release:
    needs: detect-runtime-changes
    if: needs.detect-runtime-changes.outputs.should_release == 'true'
    name: build and publish Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          $tag = "desktop-v$version"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "MAZETTO-Desktop-Release"
          }
          $tagExists = $false
          try {
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag"
            Invoke-RestMethod -Uri $uri -Headers $headers | Out-Null
            $tagExists = $true
          } catch {
            $statusCode = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
            if ($statusCode -ne 404) { throw }
          }
          if ($tagExists) {
            throw "Git tag $tag already exists. Increment apps/desktop/package.json before publishing another build."
          }

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        shell: pwsh
        run: corepack enable

      - name: Install
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build desktop shell
        shell: pwsh
        run: pnpm --filter mazetto-desktop build

      - name: Build bundled POS UI
        shell: pwsh
        run: pnpm --filter mazetto-desktop build:ui

      - name: Build installer
        shell: pwsh
        run: pnpm --filter mazetto-desktop exec electron-builder --win nsis --publish never

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          $tag = "desktop-v$version"
          $versionedInstaller = "apps/desktop/release/MAZETTO-Desktop-$version-x64.exe"
          $latestInstaller = "apps/desktop/release/MAZETTO-Desktop-latest-x64.exe"
          Copy-Item $versionedInstaller $latestInstaller -Force
          $assets = @(
            $versionedInstaller,
            $latestInstaller,
            "apps/desktop/release/MAZETTO-Desktop-$version-x64.exe.blockmap",
            "apps/desktop/release/latest.yml"
          )
          gh release create $tag $assets --title "MAZETTO Desktop $version" --notes "Windows desktop release $version" --latest
