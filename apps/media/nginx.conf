server {
  listen 80;
  server_name _;

  root /media;

  location = /healthz {
    access_log off;
    return 204;
  }

  location ~ ^/__upload/(products|categories|homepage)/([0-9a-f-]{36}[.](?:png|jpg|webp|gif))$ {
    if ($http_cf_ray != "") {
      return 403;
    }

    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    alias /media/$1/$2;
    dav_methods PUT;
    create_full_put_path on;
    client_max_body_size 5m;

    limit_except PUT {
      deny all;
    }
  }

  location /__upload/ {
    return 400;
  }

  location / {
    try_files $uri =404;
  }

  location ~* [.](?:avif|gif|ico|jpe?g|png|svg|webp)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~ /. {
    return 404;
  }
}