packages:
  - "apps/*"
  - "packages/*"

overrides:
  proxy-addr: 2.0.8
  multer: 2.4.0
  engine.io: 6.6.10
  path-to-regexp: 8.4.0
  qs: 6.16.0
  sharp: 0.35.5
  source-map-js: 1.2.2
  file-type: 21.3.2
  js-yaml: 4.3.2
  builder-util-runtime: 9.7.0
  deepmerge-ts: 8.0.2
  decode-uri-component: 0.5.0
  stream-json: 3.6.0
  webpack: 5.111.1
  picomatch: 4.0.7
  esbuild: 0.28.2
  fast-uri: 3.1.8
  "brace-expansion@1": 1.1.21
  "brace-expansion@2": 2.1.7
  "brace-expansion@5": 5.0.12
  http-cache-semantics: 4.3.0
  "@hono/node-server": 1.19.15
  hono: 4.13.7
  lodash: 4.18.1
  effect: 3.20.0
  mysql2: 3.23.1
  valibot: 1.4.2

allowBuilds:
  # `@nestjs/swagger` bilan kelgan telemetriya paketi. Uning post-install
  # skripti tashqi xizmatga signal yuboradi, ya'ni bizga kerak emas — ataylab
  # RAD etilgan. `false` yozilmasa pnpm har buyruqda ogohlantirib to'xtaydi.
  "@scarf/scarf": false
  "@nestjs/core": true
  "@prisma/engines": true
  "electron": true
  "electron-winstaller": true
  "esbuild": true
  "prisma": true
  '@parcel/watcher': false
  '@swc/core': false

patchedDependencies:
  minio@8.0.7: patches/minio@8.0.7.patch
